name: Code Quality

on:
  pull_request:
  push:
    branches: [develop]

concurrency:
  group: jrm-ci-shared-cache
  cancel-in-progress: false

jobs:
  clear-previous-ci-reviews:
    name: "[cleanup] previous CI reviews"
    runs-on: linux
    container:
      image: cpp-ci:latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Remove previous CI reviews
        env:
          GITEATOKEN: ${{ secrets.GITEATOKEN }}
        run: python3 .gitea/clear_ci_reviews.py

  clang-format:
    name: "[fmt] clang-format"
    needs: clear-previous-ci-reviews
    runs-on: linux
    container:
      image: cpp-ci:latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Check clang-format
        env:
          GITEATOKEN: ${{ secrets.GITEATOKEN }}
        run: python3 .gitea/check_clang_format.py --base develop

  build:
    name: "[build/test] ${{ matrix.compiler }} ${{ matrix.config }}"
    needs: clear-previous-ci-reviews
    runs-on: linux
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        config: [debug, release]
    container:
      image: cpp-ci:latest
      volumes:
        - /srv/ci-cache/ccache:/ccache
    env:
      CCACHE_DIR: /ccache
      CCACHE_NAMESPACE: jrm-${{ matrix.compiler }}-${{ matrix.config }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure
        run: cmake --preset ${{ matrix.compiler }}-${{ matrix.config }} -DJRM_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build --preset ${{ matrix.compiler }}-${{ matrix.config }} --parallel
      - name: Run tests
        run: ctest --preset ${{ matrix.compiler }}-${{ matrix.config }}
      - name: Check CMake regressions
        if: matrix.compiler == 'gcc' && matrix.config == 'debug'
        run: python3 .gitea/check_cmake.py --build-dir build/gcc-debug

  clang-tidy:
    name: "[lint] clang-tidy"
    needs: build
    runs-on: linux
    container:
      image: cpp-ci:latest
      volumes:
        - /srv/ci-cache/ccache:/ccache
    env:
      CCACHE_DIR: /ccache
      CCACHE_NAMESPACE: jrm-clang-debug
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Configure and generate analysis headers
        run: |
          cmake --preset clang-debug -DJRM_WARNINGS_AS_ERRORS=ON
          cmake --build --preset clang-debug --target JRMTests_CodeReflector --parallel
      - name: Check clang-tidy
        env:
          GITEATOKEN: ${{ secrets.GITEATOKEN }}
        run: python3 .gitea/check_clang_tidy.py --base develop --build-dir build/clang-debug --fail-on error

  code-coverage:
    name: "[coverage] gcc"
    needs: build
    runs-on: linux
    container:
      image: cpp-ci:latest
      volumes:
        - /srv/ci-cache/ccache:/ccache
    env:
      CCACHE_DIR: /ccache
      CCACHE_NAMESPACE: jrm-gcc-coverage
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure and generate coverage report
        run: |
          cmake --preset coverage-gcc -DJRM_WARNINGS_AS_ERRORS=ON
          cmake --build --preset coverage-gcc --parallel
      - name: Publish coverage to Gitea
        env:
          GITEATOKEN: ${{ secrets.GITEATOKEN }}
        run: |
          python3 .gitea/publish_code_coverage.py \
            --summary build/coverage-gcc/coverage/summary.json \
            --report build/coverage-gcc/coverage/index.html

  valgrind:
    name: "[test] valgrind (clang)"
    needs: build
    runs-on: linux
    container:
      image: cpp-ci:latest
      volumes:
        - /srv/ci-cache/ccache:/ccache
    env:
      CCACHE_DIR: /ccache
      CCACHE_NAMESPACE: jrm-clang-debug
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build tests
        run: |
          cmake --preset clang-debug -DJRM_WARNINGS_AS_ERRORS=ON
          cmake --build --preset clang-debug --parallel
      - name: Run tests under Valgrind
        env:
          GITEATOKEN: ${{ secrets.GITEATOKEN }}
        run: |
          set -o pipefail
          python3 .gitea/check_valgrind.py \
            --executable build/clang-debug/bin/JRMTests \
            --verbose 2>&1 | tee valgrind-output.txt
